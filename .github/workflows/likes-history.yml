name: Update article like history

on:
  schedule:
    - cron: '23 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article-like-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'matplotlib==3.10.8'
      - name: Collect likes and draw history
        run: python scripts/update-like-history.py
      - name: Save weekly snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/article-likes.json data/likes-history.json docs/likes-history.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update article like history'
          git pull --rebase origin main
          git push origin HEAD:main
